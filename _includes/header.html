<header class="site-header">

  <div class="header-inner">

    <div class="brand">

      <a href="{{ '/' | relative_url }}" class="brand-link">

        <img
          src="{{ '/images/avatar.jpg' | relative_url }}"
          alt="自由飞翔"
          class="brand-avatar"
        >

        <span class="brand-text">

          <span class="brand-name">
            自由飞翔
          </span>

          <span class="brand-description">
            加拿大生活 · 随笔 · 摄影
          </span>

        </span>

      </a>

    </div>


    <nav class="site-nav">

      <a href="{{ '/' | relative_url }}">
        首页
      </a>

      {% for path in site.header_pages %}

        {% assign page = site.pages | where: "path", path | first %}

        {% if page.title %}

          <a href="{{ page.url | relative_url }}">
            {{ page.title }}
          </a>

        {% endif %}

      {% endfor %}

    </nav>

  </div>

</header>


<style>

/* =========================================
   自媒体 Header
   ========================================= */

.site-header {
  width: 100%;

  border-top: 1px solid #eee;
  border-bottom: 1px solid #e5e5e5;

  background: #fff;
}


.header-inner {
  max-width: 1100px;

  margin: 0 auto;

  padding: 18px 20px;

  display: flex;

  align-items: center;

  justify-content: space-between;

  gap: 30px;
}


/* =========================================
   品牌
   ========================================= */

.brand {
  min-width: 0;
}


.brand-link {
  display: flex;

  align-items: center;

  gap: 14px;

  text-decoration: none;

  color: inherit;
}


.brand-avatar {
  width: 58px;
  height: 58px;

  flex: 0 0 58px;

  border-radius: 50%;

  object-fit: cover;

  display: block;

  background: #f1f1f1;

  border: 1px solid #e5e5e5;
}


.brand-text {
  display: flex;

  flex-direction: column;

  justify-content: center;
}


.brand-name {
  font-size: 22px;

  line-height: 1.3;

  font-weight: 700;

  color: #222;
}


.brand-description {
  margin-top: 3px;

  font-size: 13px;

  line-height: 1.4;

  color: #888;

  letter-spacing: .3px;
}


/* =========================================
   导航
   ========================================= */

.site-nav {
  display: flex;

  align-items: center;

  gap: 25px;

  white-space: nowrap;
}


.site-nav a {
  color: #444;

  font-size: 14px;

  text-decoration: none;

  transition: color .2s ease;
}


.site-nav a:hover {
  color: #000;

  text-decoration: none;
}


/* =========================================
   手机
   ========================================= */

@media screen and (max-width: 600px) {

  .header-inner {
    padding: 14px 15px;

    gap: 12px;

    align-items: center;
  }


  .brand-link {
    gap: 10px;
  }


  .brand-avatar {
    width: 46px;
    height: 46px;

    flex-basis: 46px;
  }


  .brand-name {
    font-size: 19px;
  }


  .brand-description {
    font-size: 11px;

    margin-top: 2px;

    white-space: nowrap;
  }


  .site-nav {
    gap: 12px;
  }


  .site-nav a {
    font-size: 13px;
  }

}


/* =========================================
   很窄的手机
   ========================================= */

@media screen and (max-width: 400px) {

  .header-inner {
    padding-left: 12px;
    padding-right: 12px;

    gap: 8px;
  }


  .brand-avatar {
    width: 42px;
    height: 42px;

    flex-basis: 42px;
  }


  .brand-name {
    font-size: 18px;
  }


  .brand-description {
    font-size: 10px;
  }


  .site-nav {
    gap: 9px;
  }


  .site-nav a {
    font-size: 12px;
  }

}

</style>
