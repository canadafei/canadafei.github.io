backend:
  name: turbo-github
  turbo_site_id: 81991617-86d5-4b92-b2bc-9814807ee2d6
  branch: main

media_folder: images
public_folder: /images

site_url: https://canadafei.github.io

collections:

  - name: posts
    label: 文章
    folder: _posts
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"

    fields:
      - name: title
        label: 标题
        widget: string

      - name: date
        label: 日期
        widget: datetime

      - name: body
        label: 正文
        widget: markdown


  - name: albums
    label: 图片集
    folder: _albums
    create: true

    fields:
      - name: title
        label: 标题
        widget: string

      - name: date
        label: 日期
        widget: datetime

      - name: images
        label: 照片
        widget: list

        fields:
          - name: image
            label: 图片
            widget: image
